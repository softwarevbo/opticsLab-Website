<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     viewBox="0 0 600 300" 
     width="100%" 
     height="100%"
     version="1.1"
     id="opticslab-interferometer-diagram"
     inkscape:version="1.3"
     sodipodi:docname="interferometer.svg">

  <title>Michelson Interferometer Pure Diagram</title>
  <desc>Pure 3D optical diagram of a Michelson Interferometer showing 532nm laser beam splitting, arm reflections, and circular interference fringes without text or UI content.</desc>

  <defs id="defs-interferometer-diagram">
    <linearGradient id="interBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="beamSplitterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="3" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LAYER 1: BACKGROUND & GRID -->
  <g id="layer-1-bg" inkscape:groupmode="layer" inkscape:label="1. Background &amp; Grid">
    <title>Layer 1: Diagram Background &amp; Grid</title>
    <desc>Clean card container with optical alignment grid.</desc>

    <rect width="600" height="300" rx="12" fill="url(#interBg)" filter="url(#softShadow)"/>
    <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

    <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" opacity="0.8">
      <line x1="0" y1="150" x2="600" y2="150" stroke="#0284c7" stroke-width="1" opacity="0.4"/>
      <line x1="250" y1="0" x2="250" y2="300" stroke="#0284c7" stroke-width="1" opacity="0.4"/>
    </g>
  </g>

  <!-- LAYER 2: PURE INTERFEROMETER DIAGRAM -->
  <g id="layer-2-diagram" inkscape:groupmode="layer" inkscape:label="2. Pure Interferometer Diagram">
    <title>Layer 2: Beam Splitter, Mirrors &amp; Laser Paths</title>
    <desc>532nm Green laser source block, 50/50 cube beam splitter, fixed mirror M1, movable mirror M2, split rays, and circular fringe display.</desc>

    <!-- 532nm Green Laser Source Block -->
    <g id="green-laser-source">
      <rect x="40" y="126" width="45" height="48" rx="6" fill="#334155" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="62" cy="150" r="8" fill="#059669" filter="url(#laserGlow)"/>
    </g>

    <!-- 50/50 Beam Splitter Cube (Center) -->
    <g id="beam-splitter-cube">
      <polygon points="230,120 270,120 270,180 230,180" fill="url(#beamSplitterGrad)" stroke="#0284c7" stroke-width="1.5" filter="url(#softShadow)"/>
      <line x1="230" y1="180" x2="270" y2="120" stroke="#0284c7" stroke-width="2" stroke-dasharray="3 3"/>
    </g>

    <!-- Incoming Laser Ray -->
    <line x1="85" y1="150" x2="250" y2="150" stroke="#059669" stroke-width="3" stroke-linecap="round" filter="url(#laserGlow)"/>

    <!-- Arm 1: Transmitted Ray to Fixed Mirror M1 -->
    <g id="arm-1-transmittance">
      <line x1="250" y1="150" x2="480" y2="150" stroke="#059669" stroke-width="3" stroke-linecap="round" filter="url(#laserGlow)"/>
      <rect x="480" y="110" width="10" height="80" fill="#e2e8f0" stroke="#0284c7" stroke-width="1.5" rx="2" filter="url(#softShadow)"/>
      <!-- Return Ray Arm 1 -->
      <line x1="480" y1="153" x2="250" y2="153" stroke="#34d399" stroke-width="2"/>
    </g>

    <!-- Arm 2: Reflected Ray Upwards to Movable Mirror M2 -->
    <g id="arm-2-reflection">
      <line x1="250" y1="150" x2="250" y2="40" stroke="#059669" stroke-width="3" stroke-linecap="round" filter="url(#laserGlow)"/>
      <rect x="210" y="30" width="80" height="10" fill="#e2e8f0" stroke="#0284c7" stroke-width="1.5" rx="2" filter="url(#softShadow)"/>
      <!-- Return Ray Arm 2 -->
      <line x1="253" y1="40" x2="253" y2="150" stroke="#34d399" stroke-width="2"/>
    </g>

    <!-- Combined Interference Rays Down to Detector -->
    <g id="combined-interference-rays">
      <line x1="250" y1="150" x2="250" y2="255" stroke="#059669" stroke-width="3.5" stroke-linecap="round" filter="url(#laserGlow)"/>
      <rect x="200" y="255" width="100" height="14" fill="#334155" stroke="#0284c7" stroke-width="1.5" rx="3"/>
    </g>

    <!-- Circular Interference Fringe Pattern Display (Right Side) -->
    <g id="interference-fringes-display" transform="translate(480, 235)">
      <circle cx="0" cy="0" r="32" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" filter="url(#softShadow)"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#059669" stroke-width="3" opacity="0.8"/>
      <circle cx="0" cy="0" r="17" fill="none" stroke="#059669" stroke-width="3" opacity="0.8"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#059669" stroke-width="3" opacity="0.8"/>
      <circle cx="0" cy="0" r="2.5" fill="#059669"/>
    </g>
  </g>
</svg>
