<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     viewBox="0 0 600 300" 
     width="100%" 
     height="100%"
     version="1.1"
     id="opticslab-prism-diagram"
     inkscape:version="1.3"
     sodipodi:docname="prism_simulation.svg">

  <title>N-BK7 Glass Prism Dispersion Pure Diagram</title>
  <desc>Pure 3D optical raytracing diagram demonstrating multi-wavelength spectral dispersion through an N-BK7 glass prism onto a detector screen without text or UI content.</desc>

  <defs id="defs-prism-diagram">
    <linearGradient id="prismBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="nbk7PrismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="3" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LAYER 1: BACKGROUND & GRID -->
  <g id="layer-1-bg" inkscape:groupmode="layer" inkscape:label="1. Background &amp; Grid">
    <title>Layer 1: Diagram Background &amp; Grid</title>
    <desc>Clean card container with subtle optical alignment guides.</desc>

    <rect width="600" height="300" rx="12" fill="url(#prismBg)" filter="url(#softShadow)"/>
    <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Subtle Alignment Grid -->
    <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" opacity="0.8">
      <line x1="0" y1="150" x2="600" y2="150" stroke="#0284c7" stroke-width="1" opacity="0.4"/>
      <line x1="150" y1="0" x2="150" y2="300"/>
      <line x1="300" y1="0" x2="300" y2="300"/>
      <line x1="450" y1="0" x2="450" y2="300"/>
    </g>
  </g>

  <!-- LAYER 2: PURE PRISM DISPERSION DIAGRAM -->
  <g id="layer-2-diagram" inkscape:groupmode="layer" inkscape:label="2. Pure Prism Diagram">
    <title>Layer 2: N-BK7 Prism &amp; Multi-Wavelength Ray Paths</title>
    <desc>Laser source block, incoming laser ray, glass prism crystal, refracted rainbow spectrum, and detector screen.</desc>

    <!-- Laser Source Launcher Block -->
    <g id="laser-source">
      <rect x="40" y="126" width="45" height="48" rx="6" fill="#334155" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="62" cy="150" r="8" fill="#dc2626" filter="url(#laserGlow)"/>
    </g>

    <!-- Incoming Laser Ray -->
    <g id="incoming-laser-ray">
      <line x1="70" y1="150" x2="225" y2="150" stroke="#dc2626" stroke-width="3" stroke-linecap="round" filter="url(#laserGlow)"/>
      <line x1="70" y1="147" x2="225" y2="148" stroke="#f87171" stroke-width="1.2" opacity="0.8"/>
    </g>

    <!-- N-BK7 Glass Prism (60 Degree) -->
    <g id="glass-prism">
      <polygon points="220,70 320,230 180,230" fill="url(#nbk7PrismGrad)" stroke="#0284c7" stroke-width="2" filter="url(#softShadow)"/>
      <line x1="220" y1="70" x2="235" y2="94" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Internal Refraction Paths -->
    <g id="internal-refraction">
      <line x1="202" y1="150" x2="250" y2="159" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="202" y1="150" x2="252" y2="165" stroke="#d97706" stroke-width="1.5"/>
      <line x1="202" y1="150" x2="254" y2="171" stroke="#0284c7" stroke-width="1.5"/>
    </g>

    <!-- Refracted Rainbow Dispersed Rays -->
    <g id="spectral-dispersed-rays">
      <line x1="250" y1="159" x2="500" y2="100" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" filter="url(#laserGlow)"/>
      <line x1="251" y1="162" x2="500" y2="120" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="252" y1="165" x2="500" y2="140" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="253" y1="168" x2="500" y2="160" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="254" y1="171" x2="500" y2="180" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" filter="url(#laserGlow)"/>
      <line x1="255" y1="174" x2="500" y2="200" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Detector Screen & On-Screen Spectrum -->
    <g id="detector-screen-prism">
      <rect x="500" y="70" width="12" height="160" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" rx="3"/>

      <circle cx="500" cy="100" r="3.5" fill="#dc2626"/>
      <circle cx="500" cy="120" r="3.5" fill="#ea580c"/>
      <circle cx="500" cy="140" r="3.5" fill="#d97706"/>
      <circle cx="500" cy="160" r="3.5" fill="#059669"/>
      <circle cx="500" cy="180" r="3.5" fill="#2563eb"/>
      <circle cx="500" cy="200" r="3.5" fill="#7c3aed"/>
    </g>
  </g>
</svg>
