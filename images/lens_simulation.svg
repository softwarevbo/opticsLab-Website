<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     viewBox="0 0 600 300" 
     width="100%" 
     height="100%"
     version="1.1"
     id="opticslab-lens-diagram"
     inkscape:version="1.3"
     sodipodi:docname="lens_simulation.svg">

  <title>Biconvex Lens Focal Spot Pure Diagram</title>
  <desc>Pure 3D optical raytracing diagram demonstrating parallel laser beam refraction through a SCHOTT glass biconvex lens onto a focal spot detector screen without text or UI content.</desc>

  <defs id="defs-lens-diagram">
    <linearGradient id="lensBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="schottLensShader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="laserBeamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="1"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="3" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LAYER 1: BACKGROUND & GRID -->
  <g id="layer-1-bg" inkscape:groupmode="layer" inkscape:label="1. Background &amp; Grid">
    <title>Layer 1: Diagram Background &amp; Grid</title>
    <desc>Clean card container with subtle optical axis guides.</desc>

    <rect width="600" height="300" rx="12" fill="url(#lensBg)" filter="url(#softShadow)"/>
    <rect width="598" height="298" x="1" y="1" rx="11" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Subtle Optical Axis -->
    <g stroke="#e2e8f0" stroke-width="1" opacity="0.8">
      <line x1="0" y1="150" x2="600" y2="150" stroke="#0284c7" stroke-width="1" stroke-dasharray="6 6" opacity="0.4"/>
      <line x1="150" y1="0" x2="150" y2="300" stroke-dasharray="4 4"/>
      <line x1="280" y1="0" x2="280" y2="300" stroke-dasharray="4 4"/>
      <line x1="480" y1="0" x2="480" y2="300" stroke-dasharray="4 4"/>
    </g>
  </g>

  <!-- LAYER 2: PURE OPTICAL DIAGRAM -->
  <g id="layer-2-diagram" inkscape:groupmode="layer" inkscape:label="2. Pure Lens Diagram">
    <title>Layer 2: Pure Lens Diagram Geometry</title>
    <desc>Beam launcher, SCHOTT glass biconvex lens, converging laser ray bundle, and focal spot screen.</desc>

    <!-- Beam Launcher Source Block -->
    <g id="beam-launcher">
      <rect x="35" y="90" width="30" height="120" rx="6" fill="#334155" stroke="#0284c7" stroke-width="1.5"/>
    </g>

    <!-- Incoming Collimated Laser Rays -->
    <g id="input-rays">
      <line x1="65" y1="100" x2="260" y2="100" stroke="url(#laserBeamGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="65" y1="120" x2="264" y2="120" stroke="url(#laserBeamGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="65" y1="140" x2="266" y2="140" stroke="url(#laserBeamGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="65" y1="150" x2="266" y2="150" stroke="#2563eb" stroke-width="3" stroke-linecap="round" filter="url(#laserGlow)"/>
      <line x1="65" y1="160" x2="266" y2="160" stroke="url(#laserBeamGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="65" y1="180" x2="264" y2="180" stroke="url(#laserBeamGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="65" y1="200" x2="260" y2="200" stroke="url(#laserBeamGrad)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Biconvex Lens (SCHOTT Glass Refractor) -->
    <g id="biconvex-lens">
      <path d="M 260,70 C 295,110 295,190 260,230 C 225,190 225,110 260,70 Z" fill="url(#schottLensShader)" stroke="#0284c7" stroke-width="2" filter="url(#softShadow)"/>
      <path d="M 248,85 C 265,105 265,195 248,215" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Refracted Converging Rays -->
    <g id="converging-rays">
      <line x1="260" y1="100" x2="480" y2="150" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
      <line x1="264" y1="120" x2="480" y2="150" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
      <line x1="266" y1="140" x2="480" y2="150" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
      <line x1="266" y1="150" x2="480" y2="150" stroke="#2563eb" stroke-width="3" stroke-linecap="round" filter="url(#laserGlow)"/>
      <line x1="266" y1="160" x2="480" y2="150" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
      <line x1="264" y1="180" x2="480" y2="150" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
      <line x1="260" y1="200" x2="480" y2="150" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Sharp Focal Spot -->
    <g id="focal-spot">
      <circle cx="480" cy="150" r="10" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
      <circle cx="480" cy="150" r="5" fill="#2563eb" filter="url(#laserGlow)"/>
      <circle cx="480" cy="150" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Focal Detector Screen -->
    <g id="detector-screen">
      <rect x="525" y="80" width="10" height="140" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" rx="2"/>
    </g>
  </g>
</svg>
