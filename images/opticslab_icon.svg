<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     viewBox="0 0 512 512" 
     width="512" 
     height="512"
     version="1.1"
     id="opticslab-bench-icon-light"
     inkscape:version="1.3"
     sodipodi:docname="opticslab_icon.svg">

  <title>OpticsLAB 3D Optical Bench App Icon (Light Theme)</title>
  <desc>Normal clean light theme 512x512 app icon mark representing OpticsLAB's actual Python CAD raytracing engine: Light source beam launcher, SCHOTT glass biconvex lens, focal bundle, and spot diagram detector screen in Inkscape layers.</desc>

  <defs id="defs-icon-light">
    <linearGradient id="iconLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="iconGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="iconAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="85%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LAYER 1: APP FRAME & BENCH RAIL -->
  <g id="icon-layer-1-frame" inkscape:groupmode="layer" inkscape:label="1. App Frame &amp; Rail Axis">
    <title>Layer 1: App Container &amp; Rail</title>
    <desc>512x512 rounded rectangle container with optical bench rail scale.</desc>

    <rect width="512" height="512" rx="112" fill="url(#iconLightBg)" filter="url(#iconShadow)"/>
    <rect width="506" height="506" x="3" y="3" rx="110" fill="none" stroke="#e2e8f0" stroke-width="3"/>

    <!-- Optical Bench Rail Scale -->
    <g opacity="0.5" stroke="#64748b" stroke-width="2">
      <line x1="40" y1="410" x2="472" y2="410"/>
      <line x1="60" y1="400" x2="60" y2="420"/>
      <line x1="130" y1="404" x2="130" y2="416"/>
      <line x1="200" y1="400" x2="200" y2="420"/>
      <line x1="270" y1="404" x2="270" y2="416"/>
      <line x1="340" y1="400" x2="340" y2="420"/>
      <line x1="410" y1="404" x2="410" y2="416"/>
    </g>

    <!-- Principal Optical Axis -->
    <line x1="30" y1="240" x2="480" y2="240" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  </g>

  <!-- LAYER 2: 3D OPTICAL BENCH SETUP -->
  <g id="icon-layer-2-setup" inkscape:groupmode="layer" inkscape:label="2. Optical CAD Bench Setup">
    <title>Layer 2: 3D Optical Bench &amp; Spot Diagram</title>
    <desc>Beam launcher, SCHOTT glass biconvex lens, focal bundle, and spot diagram detector screen.</desc>

    <!-- BEAM LAUNCHER -->
    <g id="icon-beam-launcher">
      <rect x="40" y="140" width="36" height="200" rx="8" fill="#334155" stroke="#0284c7" stroke-width="2"/>
      <line x1="76" y1="150" x2="76" y2="330" stroke="#0284c7" stroke-width="3"/>
    </g>

    <!-- COLLIMATED LASER RAYS -->
    <g id="icon-laser-rays">
      <path d="M 76,170 L 210,170" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <path d="M 76,210 L 205,210" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
      <path d="M 76,240 L 200,240" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
      <path d="M 76,270 L 205,270" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
      <path d="M 76,310 L 210,310" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- SCHOTT GLASS LENS -->
    <g id="icon-glass-lens">
      <rect x="206" y="325" width="28" height="35" fill="#475569" stroke="#0284c7" stroke-width="1.5"/>
      <path d="M 220,80 C 275,130 275,350 220,400 C 165,350 165,130 220,80 Z" fill="url(#iconGlassGrad)" stroke="#0284c7" stroke-width="3.5" filter="url(#iconShadow)"/>
      <path d="M 204,105 C 235,145 235,335 204,375" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- CONVERGING RAY BUNDLE & FOCAL NODE -->
    <g id="icon-focal-bundle">
      <path d="M 220,170 L 330,240 L 420,195" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
      <path d="M 220,210 L 330,240 L 420,225" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <path d="M 220,240 L 330,240 L 420,240" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
      <path d="M 220,270 L 330,240 L 420,255" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <path d="M 220,310 L 330,240 L 420,285" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>

      <circle cx="330" cy="240" r="10" fill="#2563eb"/>
      <circle cx="330" cy="240" r="5" fill="#ffffff"/>
    </g>

    <!-- DETECTOR SCREEN & SPOT DIAGRAM -->
    <g id="icon-detector-screen">
      <rect x="420" y="100" width="48" height="280" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="3" filter="url(#iconShadow)"/>
      <ellipse cx="444" cy="240" rx="16" ry="100" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.6" stroke-dasharray="4 4"/>

      <circle cx="444" cy="195" r="3.5" fill="#7c3aed"/>
      <circle cx="444" cy="225" r="3.5" fill="#0284c7"/>
      <circle cx="444" cy="240" r="5" fill="#2563eb"/>
      <circle cx="444" cy="255" r="3.5" fill="#0284c7"/>
      <circle cx="444" cy="285" r="3.5" fill="#dc2626"/>
    </g>
  </g>

  <!-- LAYER 3: 3D TECH BADGE -->
  <g id="icon-layer-3-badge" inkscape:groupmode="layer" inkscape:label="3. 3D Badge">
    <title>Layer 3: 3D Badge</title>
    <desc>Floating 3D software technology badge.</desc>

    <g transform="translate(356, 396)">
      <rect width="94" height="52" rx="16" fill="url(#iconAccentGrad)" filter="url(#iconShadow)"/>
      <rect width="90" height="48" x="2" y="2" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
      <text x="47" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">3D</text>
    </g>
  </g>
</svg>
